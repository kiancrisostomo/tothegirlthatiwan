<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Hello Kitty Test</title>
<style>
body {
  background: linear-gradient(135deg, #fff0f5, #ffd6e0);
  display: flex;
  gap: 30px;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 40px;
  font-family: sans-serif;
}
.card {
  background: rgba(255, 255, 255, 0.85);
  backdrop-filter: blur(10px);
  padding: 25px;
  border-radius: 24px;
  box-shadow: 0 8px 30px rgba(255, 105, 180, 0.2);
  border: 2px solid #ffb3c6;
  text-align: center;
}
h3 { color: #d6336c; margin-top: 10px; font-size: 14px; }
</style>
</head>
<body>

<!-- Card 1: Iconic Head -->
<div class="card">
  <svg width="150" height="120" viewBox="0 0 140 110" xmlns="http://www.w3.org/2000/svg">
    <!-- Head & Ears -->
    <path d="M 32,16 C 24,26 16,40 16,60 C 16,82 38,96 70,96 C 102,96 124,82 124,60 C 124,40 116,26 108,16 C 102,24 94,32 82,32 C 76,32 64,32 58,32 C 46,32 38,24 32,16 Z"
          fill="#ffffff" stroke="#221e1f" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Whiskers -->
    <line x1="34" y1="60" x2="10" y2="56" stroke="#221e1f" stroke-width="3.2" stroke-linecap="round"/>
    <line x1="32" y1="68" x2="8" y2="68" stroke="#221e1f" stroke-width="3.2" stroke-linecap="round"/>
    <line x1="34" y1="76" x2="12" y2="80" stroke="#221e1f" stroke-width="3.2" stroke-linecap="round"/>
    <line x1="106" y1="60" x2="130" y2="56" stroke="#221e1f" stroke-width="3.2" stroke-linecap="round"/>
    <line x1="108" y1="68" x2="132" y2="68" stroke="#221e1f" stroke-width="3.2" stroke-linecap="round"/>
    <line x1="106" y1="76" x2="128" y2="80" stroke="#221e1f" stroke-width="3.2" stroke-linecap="round"/>
    <!-- Eyes -->
    <ellipse cx="52" cy="63" rx="4.2" ry="6" fill="#221e1f"/>
    <ellipse cx="88" cy="63" rx="4.2" ry="6" fill="#221e1f"/>
    <!-- Nose -->
    <ellipse cx="70" cy="70" rx="5" ry="3.6" fill="#fecb00" stroke="#221e1f" stroke-width="2.2"/>
    <!-- Bow -->
    <path d="M 46,30 C 28,14 14,26 22,43 C 28,54 41,45 46,36 Z" fill="#ff2d6d" stroke="#221e1f" stroke-width="3.2" stroke-linejoin="round"/>
    <path d="M 26,32 C 31,37 36,38 41,36" stroke="#221e1f" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M 52,30 C 70,14 84,26 76,43 C 70,54 57,45 52,36 Z" fill="#ff2d6d" stroke="#221e1f" stroke-width="3.2" stroke-linejoin="round"/>
    <path d="M 72,32 C 67,37 62,38 57,36" stroke="#221e1f" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <circle cx="49" cy="33" r="8.5" fill="#ff2d6d" stroke="#221e1f" stroke-width="3.2"/>
    <ellipse cx="47" cy="30" rx="3.5" ry="2" fill="#ff7da7" transform="rotate(-25 47 30)"/>
  </svg>
  <h3>Iconic Hello Kitty Head</h3>
</div>

<!-- Card 2: Peeking Hello Kitty with Paws -->
<div class="card">
  <svg width="150" height="120" viewBox="0 0 140 115" xmlns="http://www.w3.org/2000/svg">
    <!-- Head & Ears -->
    <path d="M 32,16 C 24,26 16,40 16,60 C 16,82 38,96 70,96 C 102,96 124,82 124,60 C 124,40 116,26 108,16 C 102,24 94,32 82,32 C 76,32 64,32 58,32 C 46,32 38,24 32,16 Z"
          fill="#ffffff" stroke="#221e1f" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Whiskers -->
    <line x1="34" y1="60" x2="10" y2="56" stroke="#221e1f" stroke-width="3.2" stroke-linecap="round"/>
    <line x1="32" y1="68" x2="8" y2="68" stroke="#221e1f" stroke-width="3.2" stroke-linecap="round"/>
    <line x1="34" y1="76" x2="12" y2="80" stroke="#221e1f" stroke-width="3.2" stroke-linecap="round"/>
    <line x1="106" y1="60" x2="130" y2="56" stroke="#221e1f" stroke-width="3.2" stroke-linecap="round"/>
    <line x1="108" y1="68" x2="132" y2="68" stroke="#221e1f" stroke-width="3.2" stroke-linecap="round"/>
    <line x1="106" y1="76" x2="128" y2="80" stroke="#221e1f" stroke-width="3.2" stroke-linecap="round"/>
    <!-- Eyes -->
    <ellipse cx="52" cy="63" rx="4.2" ry="6" fill="#221e1f"/>
    <ellipse cx="88" cy="63" rx="4.2" ry="6" fill="#221e1f"/>
    <!-- Nose -->
    <ellipse cx="70" cy="70" rx="5" ry="3.6" fill="#fecb00" stroke="#221e1f" stroke-width="2.2"/>
    <!-- Bow -->
    <path d="M 46,30 C 28,14 14,26 22,43 C 28,54 41,45 46,36 Z" fill="#ff2d6d" stroke="#221e1f" stroke-width="3.2" stroke-linejoin="round"/>
    <path d="M 26,32 C 31,37 36,38 41,36" stroke="#221e1f" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M 52,30 C 70,14 84,26 76,43 C 70,54 57,45 52,36 Z" fill="#ff2d6d" stroke="#221e1f" stroke-width="3.2" stroke-linejoin="round"/>
    <path d="M 72,32 C 67,37 62,38 57,36" stroke="#221e1f" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <circle cx="49" cy="33" r="8.5" fill="#ff2d6d" stroke="#221e1f" stroke-width="3.2"/>
    <!-- Cute Paws on Ledge -->
    <ellipse cx="44" cy="98" rx="10" ry="8" fill="#ffffff" stroke="#221e1f" stroke-width="3"/>
    <ellipse cx="96" cy="98" rx="10" ry="8" fill="#ffffff" stroke="#221e1f" stroke-width="3"/>
  </svg>
  <h3>Peeking with Paws</h3>
</div>

<!-- Card 3: Full Body Hello Kitty Holding Love Letter -->
<div class="card">
  <svg width="150" height="160" viewBox="0 0 140 160" xmlns="http://www.w3.org/2000/svg">
    <!-- Feet -->
    <ellipse cx="54" cy="148" rx="12" ry="7" fill="#ff2d6d" stroke="#221e1f" stroke-width="3"/>
    <ellipse cx="86" cy="148" rx="12" ry="7" fill="#ff2d6d" stroke="#221e1f" stroke-width="3"/>
    <!-- Pink Dress / Overalls -->
    <path d="M 50,86 C 42,96 40,122 42,142 C 52,145 88,145 98,142 C 100,122 98,96 90,86 Z"
          fill="#ff4081" stroke="#221e1f" stroke-width="3.2" stroke-linejoin="round"/>
    <!-- Yellow Shirt Collar/Sleeves -->
    <circle cx="46" cy="96" r="8" fill="#ffe600" stroke="#221e1f" stroke-width="2.5"/>
    <circle cx="94" cy="96" r="8" fill="#ffe600" stroke="#221e1f" stroke-width="2.5"/>
    <path d="M 58,86 C 64,92 76,92 82,86 Z" fill="#ffe600" stroke="#221e1f" stroke-width="2"/>
    <!-- Love Letter -->
    <rect x="52" y="104" width="36" height="26" rx="4" fill="#ffffff" stroke="#ff2d6d" stroke-width="2.2"/>
    <path d="M 53,105 L 70,119 L 87,105" stroke="#ff2d6d" stroke-width="1.8" fill="none" stroke-linejoin="round"/>
    <!-- Heart Stamp on Letter -->
    <path d="M 70,122 C 67,118 62,119 62,122 C 62,124 70,128 70,128 C 70,128 78,124 78,122 C 78,119 73,118 70,122 Z" fill="#ff2d6d"/>
    <!-- Paws holding letter -->
    <ellipse cx="48" cy="116" rx="7.5" ry="6.5" fill="#ffffff" stroke="#221e1f" stroke-width="2.8"/>
    <ellipse cx="92" cy="116" rx="7.5" ry="6.5" fill="#ffffff" stroke="#221e1f" stroke-width="2.8"/>

    <!-- Head & Ears -->
    <path d="M 32,16 C 24,26 16,40 16,60 C 16,82 38,96 70,96 C 102,96 124,82 124,60 C 124,40 116,26 108,16 C 102,24 94,32 82,32 C 76,32 64,32 58,32 C 46,32 38,24 32,16 Z"
          fill="#ffffff" stroke="#221e1f" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Whiskers -->
    <line x1="34" y1="60" x2="10" y2="56" stroke="#221e1f" stroke-width="3.2" stroke-linecap="round"/>
    <line x1="32" y1="68" x2="8" y2="68" stroke="#221e1f" stroke-width="3.2" stroke-linecap="round"/>
    <line x1="34" y1="76" x2="12" y2="80" stroke="#221e1f" stroke-width="3.2" stroke-linecap="round"/>
    <line x1="106" y1="60" x2="130" y2="56" stroke="#221e1f" stroke-width="3.2" stroke-linecap="round"/>
    <line x1="108" y1="68" x2="132" y2="68" stroke="#221e1f" stroke-width="3.2" stroke-linecap="round"/>
    <line x1="106" y1="76" x2="128" y2="80" stroke="#221e1f" stroke-width="3.2" stroke-linecap="round"/>
    <!-- Eyes -->
    <ellipse cx="52" cy="63" rx="4.2" ry="6" fill="#221e1f"/>
    <ellipse cx="88" cy="63" rx="4.2" ry="6" fill="#221e1f"/>
    <!-- Nose -->
    <ellipse cx="70" cy="70" rx="5" ry="3.6" fill="#fecb00" stroke="#221e1f" stroke-width="2.2"/>
    <!-- Bow -->
    <path d="M 46,30 C 28,14 14,26 22,43 C 28,54 41,45 46,36 Z" fill="#ff2d6d" stroke="#221e1f" stroke-width="3.2" stroke-linejoin="round"/>
    <path d="M 26,32 C 31,37 36,38 41,36" stroke="#221e1f" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M 52,30 C 70,14 84,26 76,43 C 70,54 57,45 52,36 Z" fill="#ff2d6d" stroke="#221e1f" stroke-width="3.2" stroke-linejoin="round"/>
    <path d="M 72,32 C 67,37 62,38 57,36" stroke="#221e1f" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <circle cx="49" cy="33" r="8.5" fill="#ff2d6d" stroke="#221e1f" stroke-width="3.2"/>
    <ellipse cx="47" cy="30" rx="3.5" ry="2" fill="#ff7da7" transform="rotate(-25 47 30)"/>
  </svg>
  <h3>Holding Love Letter</h3>
</div>

</body>
</html>
